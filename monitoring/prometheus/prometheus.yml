global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: serveware-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["serveware-prod-web:8000"]
        labels: { env: production }

  - job_name: serveware-staging
    metrics_path: /metrics
    static_configs:
      - targets: ["serveware-staging-web:8000"]
        labels: { env: staging }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
